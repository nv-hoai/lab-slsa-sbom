name: Keyless Artifact Signing with Cosign

on:
  push:
    tags:
      - "v*" # v1.0.0, v2.0.0, ...
  workflow_dispatch: # Allow manual runs from the GitHub web UI

permissions:
  contents: read
  id-token: write # Required to obtain the GitHub OIDC token for Sigstore Fulcio

jobs:
  build-and-sign:
    name: Build, sign and verify release artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Package Release Artifact
        run: |
          tar -czvf release.tar.gz app.py main.py requirements.txt
          sha256sum release.tar.gz > release.tar.gz.sha256
          echo "Da dong goi release.tar.gz thanh cong."

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign Artifact Keylessly
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature release.tar.gz.sig \
            --output-certificate release.tar.gz.pem \
            release.tar.gz
          echo "Ky so Keyless thanh cong! Chung chi Fulcio va chu ky da duoc tao."

      - name: Verify Signed Artifact
        run: |
          cosign verify-blob \
            --certificate release.tar.gz.pem \
            --signature release.tar.gz.sig \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/cosign-sign.yml@${{ github.ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            release.tar.gz

      - name: Upload Signed Artifacts Package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-signed-package
          path: |
            release.tar.gz
            release.tar.gz.sig
            release.tar.gz.pem
            release.tar.gz.sha256
